name: CI Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  lint-backend:
    name: Backend Linting
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install lint dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flake8 black mypy isort
        pip install -r requirements.txt
        if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi

    - name: Run Black (format check)
      run: black --check backend/

    - name: Run isort (import order check)
      run: isort --check-only backend/

    - name: Run Flake8
      run: flake8 backend/ --max-line-length=100 --exclude=venv,__pycache__,.git,migrations

    - name: Run MyPy
      run: mypy backend/ --ignore-missing-imports

  test-backend:
    name: Backend Tests
    runs-on: ubuntu-latest
    needs: lint-backend

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -r requirements-dev.txt

    - name: Run tests with coverage
      env:
        # FLASK_ENV=testing garante que TestingConfig seja usada
        # (SQLite em memória, validate() no-op — sem necessidade de .env)
        FLASK_ENV: testing
        SECRET_KEY: ci-test-secret-key
        GEMINI_API_KEY: ci-test-gemini-key
      run: |
        pytest backend/tests/ -v --cov=backend --cov-report=xml --cov-report=html

    - name: Upload coverage reports
      uses: codecov/codecov-action@v4
      with:
        file: ./coverage.xml
        flags: backend
        fail_ci_if_error: false

  docker-build:
    name: Docker Build Test
    runs-on: ubuntu-latest
    needs: [lint-backend, test-backend]

    steps:
    - uses: actions/checkout@v4

    - name: Build Backend Docker Image
      run: docker build -f Dockerfile.backend -t email-analyzer-backend:test .

    - name: Test Backend Container Starts
      run: |
        docker run -d --name test-backend \
          -e FLASK_ENV=testing \
          -e GEMINI_API_KEY=test \
          -e SECRET_KEY=test-secret \
          email-analyzer-backend:test
        sleep 5
        docker logs test-backend
        docker stop test-backend || true

  security-scan:
    name: Security Scanning
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@master
      with:
        scan-type: 'fs'
        scan-ref: '.'
        format: 'sarif'
        output: 'trivy-results.sarif'
        severity: 'HIGH,CRITICAL'

    - name: Upload Trivy results to GitHub Security
      uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: 'trivy-results.sarif'
