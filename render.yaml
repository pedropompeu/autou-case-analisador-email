services:
  - type: web
    name: email-analyzer-backend
    runtime: python
    buildCommand: "pip install -r requirements.txt"
    startCommand: "gunicorn wsgi:app"
    envVars:
      - key: FLASK_ENV
        value: production
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: SECRET_KEY
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: email-analyzer-db
          property: connectionString

databases:
  - name: email-analyzer-db
    databaseName: email_analyzer
    user: postgres
